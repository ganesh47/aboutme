about_content: | # this will include new lines to allow paragraphs
  VP Engineering & Tech at Vivriti Next since May 2026.

  Engineering and product leader with 15+ years of experience building and scaling data- and cloud-driven
  products in enterprise environments. My experience spans banking, fintech, lending, industrials and
  manufacturing. I take complex, domain-heavy technology from early concept through
  production and customer adoption, combining technical judgment with product thinking and commercial
  execution. My work includes AI and data platforms, SaaS and platform business models, and
  cross-functional leadership across engineering, product and commercial teams.

